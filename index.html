<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReniQuid - Zero-G Fluid WebGL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <canvas id="glcanvas"></canvas>

    <div id="header-overlay">
        <div class="header-title">RENIQUID</div>
        <div class="header-nav">
            <a href="#content-section" class="header-link">DEEP DIVE</a>
            <a href="https://github.com/leshoraa" class="header-link">AUTHOR</a>
            <a href="https://github.com/leshoraa/ReniQuid" target="_blank" class="header-link">GITHUB</a>
        </div>
    </div>
    
    <div id="hero-section">
        <h1 id="title-main" class="welcome-title">RENIQUID</h1>
        <p id="title-sub" class="welcome-subtitle">ZERO-G FLUID EXPERIENCE</p>
        <div id="title-hint" class="welcome-hint">SCROLL DOWN TO EXPLORE</div>
    </div>
    
    <div id="content-section">
        <div class="showcase-content">
            <h2 id="showcase-title">DEEP DIVE</h2>
            <p id="showcase-sub">Use WASD to move the ReniQuid.</p>

            <div class="ui-components">
                <div class="ui-item">
                    <div class="ui-label">ACTION BUTTON</div>
                    <div id="ui-btn" class="ui-btn">ACTIVATE</div>
                </div>
                <div class="ui-item">
                    <div class="ui-label">TOGGLE SWITCH</div>
                    <div id="ui-switch" class="ui-switch">
                        <div id="ui-knob" class="ui-knob"></div>
                    </div>
                </div>
                <div class="ui-item">
                    <div class="ui-label">RANGE SLIDER</div>
                    <div id="ui-slider" class="ui-slider">
                        <div id="ui-slider-knob" class="ui-slider-knob"></div>
                    </div>
                </div>

                <div class="ui-item">
                    <div class="ui-label">MEDIA PLAY</div>
                    <div id="ui-icon-btn" class="ui-icon-btn">▶</div>
                </div>
            </div>

        </div>
    </div>
    <div id="inspiration-section">
        <div class="inspiration-content">
            <h2 class="inspiration-title">INSPIRATION</h2>
            <p class="inspiration-sub">NASA Johnson Space Center Zero-G</p>
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/H_qPWZbxFl8?si=B_dwxqE4SWv4BWo7" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>

</html>
